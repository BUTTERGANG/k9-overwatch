[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "k9overwatch"
version = "0.1.0"
description = "Lost & found pet aggregation platform"
requires-python = ">=3.11"
dependencies = [
    # HTTP
    "requests>=2.31",
    "aiohttp>=3.9",
    # HTML parsing
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    # Data modeling / validation
    "pydantic>=2.6",
    # Database
    "sqlalchemy>=2.0",
    "aiosqlite>=0.19",
    "greenlet>=3.0", # required by SQLAlchemy async on Python 3.12+
    # Geocoding / geo math
    "geopy>=2.4",
    # Fuzzy matching
    "rapidfuzz>=3.6",
    # Scheduling
    "apscheduler>=3.10",
    # Utilities
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "tenacity>=8.2", # retry decorator for HTTP/scraper calls
    "zipcodes>=1.2",  # nationwide US ZIP centroid lookup (no external downloads)
    # Web App
    "fastapi>=0.111",
    "starlette>=0.37",       # request-first TemplateResponse signature
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    # Browser scrapers
    "playwright>=1.43",
    "playwright-stealth>=0.0.1",
]

[project.optional-dependencies]
postgres = [
    "asyncpg>=0.29",
    "alembic>=1.13",
]
visual = [
    # Optional perceptual-hash visual similarity (roadmap C11). Only needed
    # when VISUAL_SIMILARITY_ENABLED=1; image decode via Pillow.
    "Pillow>=10.0",
]
browser = [
    "playwright>=1.43",
    "playwright-stealth>=0.0.1",
]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.28",
    "ruff>=0.3",
    "mypy>=1.9",
    "ipython",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    # Legacy style — predates lint setup; cosmetic only, not bug-catching
    "E501",   # line too long (raising the limit would re-flag 27 lines from the UP045 Optional→|None expansion)
    "E711",   # comparison to None (use `is` not `==`)
    "E712",   # comparison to True/False (use `is` not `==`)
]

[tool.ruff.lint.per-file-ignores]
# FastAPI intentionally uses Depends()/Query() in route-signature defaults;
# B008 is a false positive for that idiom.
"src/k9overwatch/web/**/*.py" = ["B008"]
# main.py calls load_dotenv() between stdlib/third-party and local imports so
# that the local modules see env vars at import time.
"src/k9overwatch/web/main.py" = ["E402"]
