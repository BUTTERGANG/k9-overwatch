{% extends "base.html" %}
{% block title %}Sign In | K9-Overwatch{% endblock %}

{% block content %}
<div class="flex-1 flex items-center justify-center py-12 px-4">
    <div class="w-full max-w-sm">

        <!-- Card -->
        <div class="bg-white dark:bg-slate-800 rounded-2xl p-8 shadow-card-hover border border-slate-100 dark:border-slate-700">

            <!-- Logo + heading -->
            <div class="text-center mb-7">
                <span class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-brand-600 text-white shadow mb-4">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-7 h-7" aria-hidden="true">
                        <ellipse cx="8.5"  cy="7"  rx="1.5" ry="2"/>
                        <ellipse cx="15.5" cy="7"  rx="1.5" ry="2"/>
                        <ellipse cx="5.5"  cy="11" rx="1.5" ry="2"/>
                        <ellipse cx="18.5" cy="11" rx="1.5" ry="2"/>
                        <path d="M12 10c-2.5 0-5 2-5 4.5 0 1.5.5 2.5 1.5 3.5.8.8 1.5 1 3.5 1s2.7-.2 3.5-1c1-1 1.5-2 1.5-3.5C17 12 14.5 10 12 10z"/>
                    </svg>
                </span>
                <h1 class="text-xl font-extrabold text-slate-900 dark:text-slate-100">Sign in to K9-Overwatch</h1>
                <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Help reunite lost pets with their families.</p>
            </div>

            <!-- Error -->
            {% if error %}
            <div class="mb-5 flex items-center gap-2 bg-red-50 dark:bg-red-900/30 border border-red-200 dark:border-red-800 text-red-700 dark:text-red-400 text-sm font-medium px-4 py-3 rounded-xl" role="alert">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4 flex-shrink-0" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/>
                </svg>
                {{ error }}
            </div>
            {% endif %}

            <!-- Form -->
            <form method="post" action="/auth/login" class="space-y-4">
                <input type="hidden" name="next" value="{{ next }}">

                <div>
                    <label for="email" class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Email</label>
                    <input id="email" name="email" type="email" required autocomplete="email"
                           class="w-full border border-slate-200 dark:border-slate-600 rounded-xl px-4 py-2.5 text-sm
                                  bg-white dark:bg-slate-700 text-slate-900 dark:text-slate-100
                                  placeholder-slate-400 dark:placeholder-slate-500
                                  focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition"
                           placeholder="you@example.com">
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label for="password" class="block text-sm font-semibold text-slate-700 dark:text-slate-300">Password</label>
                    </div>
                    <input id="password" name="password" type="password" required autocomplete="current-password"
                           class="w-full border border-slate-200 dark:border-slate-600 rounded-xl px-4 py-2.5 text-sm
                                  bg-white dark:bg-slate-700 text-slate-900 dark:text-slate-100
                                  placeholder-slate-400 dark:placeholder-slate-500
                                  focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition"
                           placeholder="••••••••">
                </div>

                <button type="submit"
                        class="w-full bg-brand-600 hover:bg-brand-700 text-white font-semibold text-sm py-2.5 rounded-xl
                               transition-all active:scale-95 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-500 focus-visible:ring-offset-1 mt-2">
                    Sign in
                </button>
            </form>

            <p class="mt-5 text-center text-sm text-slate-500 dark:text-slate-400">
                Don't have an account?
                <a href="/auth/register" class="font-semibold text-brand-600 hover:text-brand-800 transition-colors">Create one</a>
            </p>
        </div>

    </div>
</div>
{% endblock %}
