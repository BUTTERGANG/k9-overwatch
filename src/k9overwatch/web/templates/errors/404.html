{% extends "base.html" %}
{% block title %}404 Not Found | K9-Overwatch{% endblock %}

{% block content %}
<div class="flex flex-col items-center justify-center flex-1 py-24 text-center px-6 animate-fade-in">

    <!-- Illustration -->
    <div class="relative mb-8" aria-hidden="true">
        <!-- Dashed circle background -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none"
             class="w-40 h-40 text-slate-100">
            <circle cx="80" cy="80" r="74" stroke="currentColor" stroke-width="3" stroke-dasharray="10 6"/>
        </svg>
        <!-- Paw print centered inside -->
        <div class="absolute inset-0 flex items-center justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" fill="none" class="w-24 h-24 text-slate-200">
                <ellipse cx="18" cy="13" rx="5.5" ry="7"   fill="currentColor"/>
                <ellipse cx="38" cy="13" rx="5.5" ry="7"   fill="currentColor"/>
                <ellipse cx="8"  cy="24" rx="5.5" ry="7"   fill="currentColor"/>
                <ellipse cx="48" cy="24" rx="5.5" ry="7"   fill="currentColor"/>
                <path d="M28 22c-8 0-15 5.5-15 12 0 4 1.5 7 4.5 10 2.5 2.5 4.5 3 10.5 3s8-.5 10.5-3c3-3 4.5-6 4.5-10 0-6.5-7-12-15-12z" fill="currentColor"/>
                <text x="21" y="36" font-size="14" fill="white" font-weight="bold" font-family="ui-monospace,monospace" opacity="0.9">?</text>
            </svg>
        </div>
    </div>

    <!-- Error code + heading -->
    <div class="mb-3">
        <span class="text-xs font-bold text-slate-300 uppercase tracking-widest">Error 404</span>
    </div>
    <h1 class="text-4xl font-extrabold text-slate-900 tracking-tight mb-3">Page Not Found</h1>
    <p class="text-base text-slate-500 mb-8 max-w-sm leading-relaxed">
        This pet listing may have been removed, expired, or the URL might be incorrect.
    </p>

    <!-- CTAs -->
    <div class="flex flex-wrap justify-center gap-3">
        <a href="/map"
           class="px-6 py-3 bg-brand-600 text-white rounded-xl font-semibold
                  hover:bg-brand-700 active:scale-95 transition-all shadow-sm text-sm
                  focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-500 focus-visible:ring-offset-2">
            View Map
        </a>
        <a href="/pets"
           class="px-6 py-3 bg-white border border-slate-200 text-slate-700 rounded-xl font-semibold
                  hover:bg-slate-50 hover:border-slate-300 active:scale-95 transition-all shadow-sm text-sm
                  focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-400 focus-visible:ring-offset-2">
            Browse Pets
        </a>
    </div>
</div>
{% endblock %}
