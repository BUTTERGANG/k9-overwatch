{% extends "base.html" %}
{% block title %}{{ title }} | K9-Overwatch{% endblock %}
{% block content %}
<div class="flex-grow flex items-center justify-center px-4 py-20">
  <div class="glass-card rounded-2xl shadow-card p-10 w-full max-w-md animate-fade-in text-center">
    <h1 class="text-2xl font-bold text-slate-900 dark:text-slate-100 mb-3">{{ title }}</h1>
    <p class="text-slate-600 dark:text-slate-400">{{ message }}</p>
    <a href="/map" class="inline-block mt-6 text-brand-600 dark:text-brand-400 font-semibold hover:text-brand-700 dark:hover:text-brand-300 transition-colors">&larr; Back to the map</a>
  </div>
</div>
{% endblock %}
