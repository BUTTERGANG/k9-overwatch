{% extends "base.html" %}
{% block title %}Edit report | K9-Overwatch{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto px-4 py-10">
  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
    <h1 class="text-2xl font-bold text-gray-900 mb-1">Edit report</h1>
    <p class="text-sm text-gray-500 mb-6">Update the details for this pet report.</p>
    {% if error %}<p class="mb-4 text-sm text-red-600 bg-red-50 border border-red-200 rounded-lg px-3 py-2">{{ error }}</p>{% endif %}
    <form method="post" action="/reports/{{ report.id }}/edit" class="space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Name</label>
          <input type="text" name="name" value="{{ report.name or '' }}" class="w-full rounded-lg border border-gray-300 px-3 py-2">
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Breed</label>
          <input type="text" name="breed" value="{{ report.breed or '' }}" placeholder="e.g. Lab mix" class="w-full rounded-lg border border-gray-300 px-3 py-2">
        </div>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Main color</label>
          <input type="text" name="color_primary" value="{{ report.color_primary or '' }}" placeholder="e.g. Black" class="w-full rounded-lg border border-gray-300 px-3 py-2">
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Gender</label>
          <select name="gender" class="w-full rounded-lg border border-gray-300 px-3 py-2">
            <option value="">Unknown</option>
            <option value="male" {% if report.gender == 'male' %}selected{% endif %}>Male</option>
            <option value="female" {% if report.gender == 'female' %}selected{% endif %}>Female</option>
          </select>
        </div>
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Distinctive features</label>
        <input type="text" name="distinctive_features" value="{{ report.distinctive_features or '' }}" placeholder="e.g. limps, white patch on chest" class="w-full rounded-lg border border-gray-300 px-3 py-2">
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Where? (address, cross streets, or area)</label>
        <input type="text" name="location_text" value="{{ report.location_text or '' }}" placeholder="e.g. 5th & Meridian, Indianapolis" class="w-full rounded-lg border border-gray-300 px-3 py-2">
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Description</label>
        <textarea name="description" rows="3" class="w-full rounded-lg border border-gray-300 px-3 py-2" placeholder="Anything that helps identify the pet">{{ report.description or '' }}</textarea>
      </div>
      <div class="grid grid-cols-3 gap-4">
        <div><label class="block text-sm font-semibold text-gray-700 mb-1">Your name</label><input type="text" name="contact_name" value="{{ report.contact_name or '' }}" class="w-full rounded-lg border border-gray-300 px-3 py-2"></div>
        <div><label class="block text-sm font-semibold text-gray-700 mb-1">Email</label><input type="email" name="contact_email" value="{{ report.contact_email or '' }}" class="w-full rounded-lg border border-gray-300 px-3 py-2"></div>
        <div><label class="block text-sm font-semibold text-gray-700 mb-1">Phone</label><input type="tel" name="contact_phone" value="{{ report.contact_phone or '' }}" class="w-full rounded-lg border border-gray-300 px-3 py-2"></div>
      </div>
      <button type="submit" class="w-full bg-indigo-600 text-white font-semibold rounded-lg py-3 hover:bg-indigo-700">Save changes</button>
    </form>
    <a href="/pets/{{ report.id }}" class="inline-block mt-4 text-sm text-gray-500 hover:text-gray-700">Cancel and go back</a>
  </div>
</div>
{% endblock %}
