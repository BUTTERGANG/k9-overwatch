{% extends "base.html" %}
{% block title %}Choose a new password | K9-Overwatch{% endblock %}
{% block content %}
<div class="flex-grow flex items-center justify-center px-4 py-12">
  <div class="glass-card rounded-2xl shadow-card p-8 w-full max-w-md animate-fade-in">
    <h1 class="text-2xl font-bold text-slate-900 dark:text-slate-100 mb-4">Choose a new password</h1>
    {% if error %}<p class="mb-4 text-sm text-red-700 bg-red-50 dark:bg-red-900/30 dark:text-red-400 border border-red-200 dark:border-red-800 rounded-lg px-3 py-2">{{ error }}</p>{% endif %}
    <form method="post" action="/reset-password" class="space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="token" value="{{ token }}">
      <input type="password" name="password" minlength="8" required class="w-full rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 px-3 py-2 placeholder-slate-400 dark:placeholder-slate-500 focus:ring-2 focus:ring-brand-500 focus:border-brand-500">
      <button class="w-full bg-brand-600 text-white font-semibold rounded-lg py-2.5 hover:bg-brand-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-500 focus-visible:ring-offset-2 transition-colors">Reset password</button>
    </form>
  </div>
</div>
{% endblock %}
