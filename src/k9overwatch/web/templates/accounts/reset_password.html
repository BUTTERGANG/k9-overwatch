{% extends "base.html" %}
{% block title %}Choose a new password | K9-Overwatch{% endblock %}
{% block content %}<div class="max-w-md mx-auto px-4 py-12"><div class="bg-white rounded-2xl shadow-sm border p-8"><h1 class="text-2xl font-bold mb-4">Choose a new password</h1>{% if error %}<p class="mb-4 text-sm text-red-600">{{ error }}</p>{% endif %}<form method="post" action="/reset-password" class="space-y-4"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="token" value="{{ token }}"><input type="password" name="password" minlength="8" required class="w-full rounded-lg border px-3 py-2"><button class="w-full bg-indigo-600 text-white rounded-lg py-2.5">Reset password</button></form></div></div>{% endblock %}
