{% extends "base.html" %}
{% block title %}Reset password | K9-Overwatch{% endblock %}
{% block content %}
<div class="flex-grow flex items-center justify-center px-4 py-12">
  <div class="glass-card rounded-2xl shadow-card p-8 w-full max-w-md animate-fade-in">
    <h1 class="text-2xl font-bold text-slate-900 dark:text-slate-100 mb-4">Reset your password</h1>
    <p class="text-sm text-slate-500 dark:text-slate-400 mb-6">Enter your email and we'll queue a reset link if an account exists.</p>
    <form method="post" action="/forgot-password" class="space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="email" name="email" required class="w-full rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 px-3 py-2 placeholder-slate-400 dark:placeholder-slate-500 focus:ring-2 focus:ring-brand-500 focus:border-brand-500">
      <button class="w-full bg-brand-600 text-white font-semibold rounded-lg py-2.5 hover:bg-brand-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-500 focus-visible:ring-offset-2 transition-colors">Send reset link</button>
    </form>
    <p class="mt-4"><a href="/login" class="text-brand-600 dark:text-brand-400 font-semibold hover:text-brand-700 dark:hover:text-brand-300 transition-colors">Back to log in</a></p>
  </div>
</div>
{% endblock %}
