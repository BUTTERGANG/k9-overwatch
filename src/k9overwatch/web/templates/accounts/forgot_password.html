{% extends "base.html" %}
{% block title %}Reset password | K9-Overwatch{% endblock %}
{% block content %}<div class="max-w-md mx-auto px-4 py-12"><div class="bg-white rounded-2xl shadow-sm border p-8"><h1 class="text-2xl font-bold mb-4">Reset your password</h1><p class="text-sm text-gray-500 mb-6">Enter your email and we’ll queue a reset link if an account exists.</p><form method="post" action="/forgot-password" class="space-y-4"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="email" name="email" required class="w-full rounded-lg border px-3 py-2"><button class="w-full bg-indigo-600 text-white rounded-lg py-2.5">Send reset link</button></form><p class="mt-4"><a href="/login" class="text-indigo-600">Back to log in</a></p></div></div>{% endblock %}
